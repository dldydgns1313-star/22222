name: Build iPad app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build for iPad
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/viewer-source"
          mkdir -p "$src"
          ditto -x -k "$GITHUB_WORKSPACE/source.zip" "$src"
          xcodebuild -project "$src/HangeulViewer.xcodeproj" -scheme HangeulViewer \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/Derived" CODE_SIGNING_ALLOWED=NO build
      - name: Package app
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Derived/Build/Products/Release-iphoneos/HangeulViewer.app"
          test -x "$app/HangeulViewer"
          xcrun lipo "$app/HangeulViewer" -verify_arch arm64
          /usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist" | grep -Fx iPhoneOS
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          ditto "$app" Payload/HangeulViewer.app
          ditto -c -k --norsrc --keepParent Payload HangeulViewer.ipa
          unzip -tq HangeulViewer.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: HangeulViewer-iPad
          path: ${{ runner.temp }}/HangeulViewer.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
